name: Hebing
permissions:
  contents: write
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 5 * * *"    
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl openssl python3 python3-pip || true
          openssl version
          python3 -m pip install requests

      - name: 执行合并脚本
        env:
          M3U_URL_LIST: ${{ secrets.M3U_URL_LIST }}
        run: |
          sed -i 's/\r$//' Hebing.sh
          chmod +x Hebing.sh
          ./Hebing.sh
          # 新增执行 merge.py
          python3 merge.py
          # ✅关键：把merge.py输出的zubo.m3u覆盖到dist目录
          cp zubo.m3u dist/

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hb
